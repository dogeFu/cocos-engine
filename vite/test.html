<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocos Engine API Test (AI Framework)</title>
    <script src="/vite/framework/ai-test-framework.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        h1 { color: #fff; border-bottom: 2px solid #4a9eff; padding-bottom: 10px; }
        h2 { color: #4a9eff; margin-top: 30px; }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #888; }
        .summary-card .value { font-size: 28px; font-weight: bold; }
        .summary-card.success .value { color: #4caf50; }
        .summary-card.error .value { color: #f44336; }
        .summary-card.warning .value { color: #ff9800; }
        .test-section {
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .test-section-header {
            background: #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-section-content { padding: 15px 20px; }
        .test-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: #222;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }
        .test-item.pass { border-left: 3px solid #4caf50; }
        .test-item.fail { border-left: 3px solid #f44336; }
        .test-name { flex: 1; }
        .test-status { font-weight: bold; margin-left: 10px; }
        .test-status.pass { color: #4caf50; }
        .test-status.fail { color: #f44336; }
        .log-container {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        .log-entry { margin: 3px 0; padding: 3px 8px; border-radius: 3px; }
        .log-entry.info { color: #2196f3; }
        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #f44336; }
        .log-entry.warn { color: #ff9800; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }
        .badge.success { background: #4caf50; color: #fff; }
        .badge.error { background: #f44336; color: #fff; }
        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #4a9eff;
            transition: width 0.3s ease;
        }
        .ai-status {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .ai-status h3 { margin-top: 0; color: #ff9800; }
        .ai-status .status-text { font-size: 14px; color: #888; }
        .ai-status .status-text.running { color: #4caf50; }
        .ai-status .status-text.error { color: #f44336; }
    </style>
</head>
<body>
    <h1>🧪 Cocos Engine API Test (AI Framework)</h1>
    
    <div class="ai-status">
        <h3>🤖 AI Test Framework Status</h3>
        <div class="status-text" id="aiStatus">Initializing...</div>
        <div style="margin-top: 10px;">
            <button onclick="window.AI_TEST_FRAMEWORK && console.log(JSON.stringify(window.AI_TEST_FRAMEWORK.getFailureReport(), null, 2))" style="background: #4a9eff; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                Export Failure Report (Console)
            </button>
        </div>
    </div>
    
    <div class="summary" id="summary">
        <div class="summary-card">
            <h3>Total Tests</h3>
            <div class="value" id="totalTests">-</div>
        </div>
        <div class="summary-card success">
            <h3>Passed</h3>
            <div class="value" id="passedTests">-</div>
        </div>
        <div class="summary-card error">
            <h3>Failed</h3>
            <div class="value" id="failedTests">-</div>
        </div>
        <div class="summary-card warning">
            <h3>Skipped</h3>
            <div class="value" id="skippedTests">-</div>
        </div>
    </div>
    
    <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>
    
    <div id="testResults"></div>
    
    <div class="log-container" id="logContainer"></div>

    <script type="module">
        const testResults = document.getElementById('testResults');
        const logContainer = document.getElementById('logContainer');
        const progressBar = document.getElementById('progressBar');
        const aiStatus = document.getElementById('aiStatus');
        const framework = window.AI_TEST_FRAMEWORK;
        
        let currentSection = null;
        let currentSectionName = '';
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            if (framework) {
                framework.log(message, type);
            }
        }
        
        function updateUI() {
            if (!framework) return;
            const summary = framework.getSummary();
            document.getElementById('totalTests').textContent = summary.total;
            document.getElementById('passedTests').textContent = summary.passed;
            document.getElementById('failedTests').textContent = summary.failed;
            document.getElementById('skippedTests').textContent = summary.skipped;
            progressBar.style.width = `${summary.total > 0 ? (summary.passed + summary.failed + summary.skipped) / summary.total * 100 : 0}%`;
        }
        
        function startSection(name) {
            if (currentSection) {
                finishSection();
            }
            currentSectionName = name;
            currentSection = document.createElement('div');
            currentSection.className = 'test-section';
            currentSection.innerHTML = `<div class="test-section-header"><span>${name}</span><span class="badge" id="sectionBadge"></span></div><div class="test-section-content" id="sectionContent"></div>`;
            testResults.appendChild(currentSection);
            
            if (framework) {
                framework.startSection(name);
            }
        }
        
        function finishSection() {
            if (!currentSection) return;
            
            const sectionData = framework.getCurrentSection();
            if (sectionData) {
                const passCount = sectionData.tests ? sectionData.tests.filter(t => t.status === 'pass').length : 0;
                const badge = currentSection.querySelector('#sectionBadge');
                if (badge) {
                    const statusClass = sectionData.tests && sectionData.tests.some(t => t.status === 'fail') ? 'error' : 'success';
                    badge.className = `badge ${statusClass}`;
                    badge.textContent = `${passCount}/${sectionData.tests ? sectionData.tests.length : 0}`;
                }
                framework.finishSection();
            }
            currentSection = null;
        }
        
        function recordTest(name, status, detail = '') {
            if (framework) {
                framework.recordTest(currentSectionName, name, status, detail);
            }
            
            if (!currentSection) return;
            
            const content = currentSection.querySelector('#sectionContent');
            if (!content) return;
            
            const item = document.createElement('div');
            item.className = `test-item ${status}`;
            item.innerHTML = `
                <span class="test-name">${name}</span>
                ${detail ? `<span style="color:#888;margin-right:10px;font-size:11px">${detail}</span>` : ''}
                <span class="test-status ${status}">${status.toUpperCase()}</span>
            `;
            content.appendChild(item);
            
            updateUI();
        }
        
        async function runTests() {
            aiStatus.textContent = 'Loading engine...';
            aiStatus.className = 'status-text running';
            log('Starting API comparison tests...', 'info');
            
            let cc;
            try {
                const gameCanvas = document.createElement('canvas');
                gameCanvas.id = 'GameCanvas';
                gameCanvas.width = 800;
                gameCanvas.height = 600;
                gameCanvas.style.display = 'none';
                document.body.appendChild(gameCanvas);
                
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = '/bin/vite/web/prod/cc.js';
                    script.onload = resolve;
                    script.onerror = (e) => reject(new Error('Failed to load /bin/vite/web/prod/cc.js'));
                    document.head.appendChild(script);
                });
                
                cc = window.cc;
                if (!cc) throw new Error('window.cc is undefined after script load');
                
                log('Engine loaded successfully', 'success');
            } catch (e) {
                log(`Failed to load engine: ${e.message}`, 'error');
                aiStatus.textContent = `Error: ${e.message}`;
                aiStatus.className = 'status-text error';
                framework.status = 'error';
                return;
            }
            
            aiStatus.textContent = 'Running tests...';
            
            // ==================== Core Math ====================
            startSection('📐 Core Math Classes');
            
            try {
                if (cc.Vec2) {
                    const v = new cc.Vec2(1, 2);
                    recordTest('Vec2', v.x === 1 && v.y === 2 ? 'pass' : 'fail', `x=${v.x}, y=${v.y}`);
                } else {
                    recordTest('Vec2', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Vec2', 'fail', e.message);
            }
            
            try {
                if (cc.Vec3) {
                    const v = new cc.Vec3(1, 2, 3);
                    recordTest('Vec3', v.x === 1 && v.y === 2 && v.z === 3 ? 'pass' : 'fail', `x=${v.x}, y=${v.y}, z=${v.z}`);
                } else {
                    recordTest('Vec3', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Vec3', 'fail', e.message);
            }
            
            try {
                if (cc.Vec4) {
                    const v = new cc.Vec4(1, 2, 3, 4);
                    recordTest('Vec4', v.x === 1 && v.y === 2 ? 'pass' : 'fail', `x=${v.x}, w=${v.w}`);
                } else {
                    recordTest('Vec4', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Vec4', 'fail', e.message);
            }
            
            try {
                if (cc.Mat3) {
                    const m = new cc.Mat3();
                    cc.Mat3.identity(m);
                    recordTest('Mat3', 'pass', 'identity() works');
                } else {
                    recordTest('Mat3', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Mat3', 'fail', e.message);
            }
            
            try {
                if (cc.Mat4) {
                    const m = new cc.Mat4();
                    cc.Mat4.identity(m);
                    const v = new cc.Vec3(0, 0, 0);
                    cc.Mat4.translate(m, m, v);
                    recordTest('Mat4', 'pass', 'identity/translate works');
                } else {
                    recordTest('Mat4', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Mat4', 'fail', e.message);
            }
            
            try {
                if (cc.Quat) {
                    const q = new cc.Quat();
                    cc.Quat.identity(q);
                    const euler = new cc.Vec3(0, 90, 0);
                    cc.Quat.fromEuler(q, euler.x, euler.y, euler.z);
                    recordTest('Quat', 'pass', 'identity/fromEuler works');
                } else {
                    recordTest('Quat', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Quat', 'fail', e.message);
            }
            
            try {
                if (cc.Color) {
                    const c = new cc.Color(255, 128, 64, 255);
                    recordTest('Color', c.r === 255 && c.g === 128 ? 'pass' : 'fail', `r=${c.r}, g=${c.g}`);
                } else {
                    recordTest('Color', 'fail', 'not exported');
                }
            } catch (e) {
                recordTest('Color', 'fail', e.message);
            }
            
            finishSection();
            
            // ==================== Core Utils ====================
            startSection('🔧 Core Utilities');
            
            recordTest('EventTarget', cc.EventTarget ? 'pass' : 'fail', cc.EventTarget ? 'class' : 'missing');
            recordTest('Event', cc.Event ? 'pass' : 'fail', cc.Event ? 'class' : 'missing');
            recordTest('Pool', cc.Pool ? 'pass' : 'fail', cc.Pool ? 'class' : 'missing');
            recordTest('RecyclePool', cc.RecyclePool ? 'pass' : 'fail', cc.RecyclePool ? 'class' : 'missing');
            recordTest('_decorator', cc._decorator ? 'pass' : 'fail', cc._decorator ? 'found' : 'missing');
            
            finishSection();
            
            // ==================== Scene Graph ====================
            startSection('🌳 Scene Graph');
            
            recordTest('Node', cc.Node ? 'pass' : 'fail', cc.Node ? 'class' : 'missing');
            recordTest('Scene', cc.Scene ? 'pass' : 'fail', cc.Scene ? 'class' : 'missing');
            recordTest('Component', cc.Component ? 'pass' : 'fail', cc.Component ? 'class' : 'missing');
            recordTest('Director', cc.Director ? 'pass' : 'fail', cc.Director ? 'class' : 'missing');
            recordTest('find', typeof cc.find === 'function' ? 'pass' : 'fail', typeof cc.find);
            recordTest('Layers', cc.Layers ? 'pass' : 'fail', cc.Layers ? 'class' : 'missing');
            
            finishSection();
            
            // ==================== 2D Components ====================
            startSection('🎨 2D Components');
            
            const components2D = [
                'Sprite', 'Label', 'Mask', 'Graphics', 'RichText',
                'UIRenderer', 'Canvas', 'UITransform', 'Widget',
                'Layout', 'Button', 'EditBox', 'ScrollView',
                'ProgressBar', 'Slider', 'Toggle'
            ];
            
            components2D.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? 'class' : 'missing');
            });
            
            finishSection();
            
            // ==================== 3D Components ====================
            startSection('🎮 3D Components');
            
            recordTest('Camera', cc.Camera ? 'pass' : 'fail', cc.Camera ? 'class' : 'missing');
            recordTest('Light', cc.Light ? 'pass' : 'fail', cc.Light ? 'class' : 'missing');
            recordTest('MeshRenderer', cc.MeshRenderer ? 'pass' : 'fail', cc.MeshRenderer ? 'class' : 'missing');
            recordTest('SkinnedMeshRenderer', cc.SkinnedMeshRenderer ? 'pass' : 'fail', cc.SkinnedMeshRenderer ? 'class' : 'missing');
            recordTest('Mesh', cc.Mesh ? 'pass' : 'fail', cc.Mesh ? 'class' : 'missing');
            recordTest('Skeleton', cc.Skeleton ? 'pass' : 'fail', cc.Skeleton ? 'class' : 'missing');
            recordTest('AnimationClip', cc.AnimationClip ? 'pass' : 'fail', cc.AnimationClip ? 'class' : 'missing');
            
            finishSection();
            
            // ==================== Assets ====================
            startSection('📦 Assets');
            
            const assetClasses = [
                'Asset', 'Texture2D', 'SpriteFrame', 'Material',
                'EffectAsset', 'Prefab', 'JsonAsset', 'TextAsset',
                'ImageAsset', 'AudioClip', 'AssetManager'
            ];
            
            assetClasses.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? 'class' : 'missing');
            });
            
            recordTest('resources', cc.resources ? 'pass' : 'fail', cc.resources ? 'object' : 'missing');
            
            finishSection();
            
            // ==================== Animation ====================
            startSection('🎬 Animation');
            
            recordTest('Animation', cc.Animation ? 'pass' : 'fail', cc.Animation ? 'class' : 'missing');
            recordTest('AnimationState', cc.AnimationState ? 'pass' : 'fail', cc.AnimationState ? 'class' : 'missing');
            
            finishSection();
            
            // ==================== Tween ====================
            startSection('🔄 Tween');
            
            recordTest('tween', typeof cc.tween === 'function' ? 'pass' : 'fail', typeof cc.tween);
            recordTest('Tween', cc.Tween ? 'pass' : 'fail', cc.Tween ? 'class' : 'missing');
            
            finishSection();
            
            // ==================== Input ====================
            startSection('�️ Input');
            
            recordTest('Input', cc.Input ? 'pass' : 'fail', cc.Input ? 'class' : 'missing');
            recordTest('EventMouse', cc.EventMouse ? 'pass' : 'fail', cc.EventMouse ? 'class' : 'missing');
            recordTest('EventKeyboard', cc.EventKeyboard ? 'pass' : 'fail', cc.EventKeyboard ? 'class' : 'missing');
            recordTest('EventTouch', cc.EventTouch ? 'pass' : 'fail', cc.EventTouch ? 'class' : 'missing');
            recordTest('KeyCode', cc.KeyCode ? 'pass' : 'fail', cc.KeyCode ? 'object' : 'missing');
            
            finishSection();
            
            // ==================== Game ====================
            startSection('🎮 Game');
            
            recordTest('Game', cc.Game ? 'pass' : 'fail', cc.Game ? 'class' : 'missing');
            recordTest('sys', cc.sys ? 'pass' : 'fail', cc.sys ? 'object' : 'missing');
            recordTest('game', cc.game ? 'pass' : 'fail', cc.game ? 'object' : 'missing');
            
            finishSection();
            
            // ==================== GFX ====================
            startSection('🖥️ Graphics Device');
            
            if (cc.gfx) {
                const gfxClasses = ['Device', 'Buffer', 'Texture', 'Shader', 'PipelineState', 'InputAssembler', 'Framebuffer', 'RenderPass', 'CommandBuffer'];
                const gfxConstants = ['Format', 'BufferUsageBit', 'MemoryUsageBit', 'Feature', 'PrimitiveMode'];
                
                gfxClasses.forEach(name => {
                    recordTest(`gfx.${name}`, cc.gfx[name] ? 'pass' : 'fail', cc.gfx[name] ? 'class' : 'missing');
                });
                
                gfxConstants.forEach(name => {
                    recordTest(`gfx.${name}`, cc.gfx[name] ? 'pass' : 'fail', cc.gfx[name] ? 'object' : 'missing');
                });
            } else {
                recordTest('gfx namespace', 'fail', 'not found');
            }
            
            finishSection();
            
            // ==================== Spine ====================
            startSection('🦴 Spine');
            
            if (cc.sp) {
                recordTest('sp.Skeleton', cc.sp.Skeleton ? 'pass' : 'fail', cc.sp.Skeleton ? 'class' : 'missing');
                recordTest('sp.SkeletonData', cc.sp.SkeletonData ? 'pass' : 'fail', cc.sp.SkeletonData ? 'class' : 'missing');
            } else {
                recordTest('sp namespace', 'fail', 'not found');
            }
            
            finishSection();
            
            // ==================== Version & Legacy ====================
            startSection('📌 Version & Legacy');
            
            recordTest('VERSION', cc.VERSION ? 'pass' : 'fail', cc.VERSION ? 'string' : 'missing');
            recordTest('cclegacy', cc.cclegacy ? 'pass' : 'fail', cc.cclegacy ? 'object' : 'missing');
            
            finishSection();
            
            // ==================== Functional Tests ====================
            startSection('🧪 Functional Tests');
            
            try {
                const Vec3 = cc.Vec3;
                const a = new Vec3(1, 0, 0);
                const b = new Vec3(0, 1, 0);
                const c = new Vec3();
                Vec3.cross(c, a, b);
                recordTest('Vec3.cross()', Math.abs(c.z - 1) < 0.001 ? 'pass' : 'fail', `c.z=${c.z}`);
            } catch (e) {
                recordTest('Vec3.cross()', 'fail', e.message);
            }
            
            try {
                const Mat4 = cc.Mat4;
                const Vec3 = cc.Vec3;
                const m = new Mat4();
                Mat4.identity(m);
                Mat4.translate(m, m, new Vec3(10, 20, 30));
                const pos = new Vec3();
                Mat4.getTranslation(pos, m);
                const pass = Math.abs(pos.x - 10) < 0.001 && Math.abs(pos.y - 20) < 0.001;
                recordTest('Mat4.translate/getTranslation', pass ? 'pass' : 'fail', `pos=(${pos.x.toFixed(1)},${pos.y.toFixed(1)})`);
            } catch (e) {
                recordTest('Mat4.translate/getTranslation', 'fail', e.message);
            }
            
            try {
                const Color = cc.Color;
                const c = new Color(255, 128, 64, 255);
                const hex = c.toHEX();
                recordTest('Color.toHEX()', hex && hex.length > 0 ? 'pass' : 'fail', hex);
            } catch (e) {
                recordTest('Color.toHEX()', 'fail', e.message);
            }
            
            finishSection();
            
            // ==================== Export Stats ====================
            startSection('📊 Export Statistics');
            
            const exportCount = Object.keys(cc).length;
            recordTest(`Total exports: ${exportCount}`, 'pass');
            
            let classes = 0, functions = 0, objects = 0;
            for (const key of Object.keys(cc)) {
                const val = cc[key];
                if (typeof val === 'function') classes++;
                else if (typeof val === 'object') objects++;
                else functions++;
            }
            recordTest(`Classes/Functions: ${classes}`, 'pass');
            recordTest(`Constants/Objects: ${objects}`, 'pass');
            
            finishSection();
            
            framework.markComplete();
            
            const summary = framework.getSummary();
            log(`\n=== Test Complete ===`, 'success');
            log(`Total: ${summary.total}, Passed: ${summary.passed}, Failed: ${summary.failed}`, 'info');
            
            if (summary.failed === 0) {
                aiStatus.textContent = '✅ All tests passed!';
                aiStatus.className = 'status-text running';
                log('✅ All tests passed!', 'success');
            } else {
                aiStatus.textContent = `⚠️ ${summary.failed} tests failed - Check console for details`;
                aiStatus.className = 'status-text error';
                log('⚠️ Some tests failed - Check console output for AI repair report', 'error');
            }
        }
        
        runTests().catch(e => {
            log(`Fatal error: ${e.message}`, 'error');
            console.error(e);
            framework.status = 'error';
            framework.errors.push({ type: 'fatal', message: e.message, stack: e.stack });
            aiStatus.textContent = `Fatal: ${e.message}`;
            aiStatus.className = 'status-text error';
        });
    </script>
</body>
</html>
