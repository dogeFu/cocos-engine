<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocos Engine Unified Test (AI Framework)</title>
    <script src="/vite/framework/ai-test-framework.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        h1 { color: #fff; border-bottom: 2px solid #4a9eff; padding-bottom: 10px; margin-bottom: 20px; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-api { background: #238636; }
        .btn-platform { background: #1f6feb; }
        .btn-behavior { background: #a371f7; }
        .btn-all { background: #da3633; }
        .btn-clear { background: #6e7681; }
        
        .status-bar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-text { font-size: 16px; font-weight: bold; }
        .status-text.idle { color: #8b949e; }
        .status-text.running { color: #58a6ff; }
        .status-text.success { color: #3fb950; }
        .status-text.error { color: #f85149; }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card h3 { margin: 0 0 10px 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .summary-card .value { font-size: 24px; font-weight: bold; }
        .summary-card.success .value { color: #4caf50; }
        .summary-card.error .value { color: #f44336; }
        .summary-card.warning .value { color: #ff9800; }
        
        .test-section {
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .test-section-header {
            background: #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-section-content { padding: 15px 20px; }
        .test-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: #222;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }
        .test-item.pass { border-left: 3px solid #4caf50; }
        .test-item.fail { border-left: 3px solid #f44336; }
        .test-name { flex: 1; }
        .test-status { font-weight: bold; margin-left: 10px; }
        .test-status.pass { color: #4caf50; }
        .test-status.fail { color: #f44336; }
        
        .log-container {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }
        .log-entry { margin: 3px 0; padding: 3px 8px; border-radius: 3px; }
        .log-entry.info { color: #2196f3; }
        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #f44336; }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.success { background: #4caf50; color: #fff; }
        .badge.error { background: #f44336; color: #fff; }
    </style>
</head>
<body>
    <h1>🧪 Cocos Engine Unified Test</h1>
    
    <div class="controls">
        <button class="btn btn-api" onclick="runTest('api')">📋 API Test</button>
        <button class="btn btn-platform" onclick="runTest('platform')">🖥️ Platform Test</button>
        <button class="btn btn-behavior" onclick="runTest('behavior')">🎯 Behavior Test</button>
        <button class="btn btn-behavior" onclick="runTest('exports')" style="background:#e67e22">📦 Export Coverage</button>
        <button class="btn btn-all" onclick="runAllTests()">🚀 Run All</button>
        <button class="btn btn-clear" onclick="clearResults()">🗑️ Clear</button>
    </div>
    
    <div class="status-bar">
        <div class="status-text idle" id="aiStatus">Idle - Select a test to run</div>
    </div>
    
    <div class="summary" id="summary">
        <div class="summary-card">
            <h3>Total Tests</h3>
            <div class="value" id="totalTests">0</div>
        </div>
        <div class="summary-card success">
            <h3>Passed</h3>
            <div class="value" id="passedTests">0</div>
        </div>
        <div class="summary-card error">
            <h3>Failed</h3>
            <div class="value" id="failedTests">0</div>
        </div>
        <div class="summary-card warning">
            <h3>Skipped</h3>
            <div class="value" id="skippedTests">0</div>
        </div>
    </div>
    
    <div id="testResults"></div>
    
    <div class="log-container" id="logContainer"></div>

    <script type="module">
        const testResults = document.getElementById('testResults');
        const logContainer = document.getElementById('logContainer');
        const aiStatus = document.getElementById('aiStatus');
        const framework = window.AI_TEST_FRAMEWORK;
        
        let currentSection = null;
        let currentSectionName = '';
        let cc = null;
        let isRunning = false;
        let testsCompleted = { api: false, platform: false, behavior: false };
        
        window.runTest = async function(type) {
            if (isRunning) return;
            isRunning = true;
            updateButtons(true);
            
            // 重置框架状态
            framework.status = 'running';
            
            try {
                if (!cc) {
                    await loadEngine();
                }
                
                switch(type) {
                    case 'api':
                        await runAPITests();
                        break;
                    case 'platform':
                        await runPlatformTests();
                        break;
                    case 'behavior':
                        await runBehaviorTests();
                        break;
                    case 'exports':
                        await runExportTests();
                        break;
                }
                
                testsCompleted[type] = true;
                // 每个测试完成后都输出报告到控制台
                framework.markComplete();
            } catch (e) {
                log(`Fatal error: ${e.message}`, 'error');
                console.error(`\n[TEST FAILED]\nFatal: ${e.message}`);
                if (e.stack) console.error(e.stack.split('\n').slice(0, 5).join('\n'));
                framework.status = 'error';
            } finally {
                isRunning = false;
                updateButtons(false);
            }
        };
        
        window.runAllTests = async function() {
            if (isRunning) return;
            testsCompleted = { api: false, platform: false, behavior: false, exports: false };
            await runTest('api');
            await runTest('platform');
            await runTest('behavior');
            await runTest('exports');
        };
        
        window.clearResults = function() {
            testResults.innerHTML = '';
            logContainer.innerHTML = '';
            framework.results.tests = [];
            framework.results.sections = [];
            framework.results.failures = [];
            framework.results.summary = { total: 0, passed: 0, failed: 0, skipped: 0 };
            framework.errors = [];
            framework.logs = [];
            framework.status = 'idle';
            testsCompleted = { api: false, platform: false, behavior: false, exports: false };
            cc = null;
            updateUI();
            aiStatus.textContent = 'Idle - Select a test to run';
            aiStatus.className = 'status-text idle';
        };
        
        async function loadEngine() {
            aiStatus.textContent = 'Loading engine...';
            aiStatus.className = 'status-text running';
            log('Loading engine...', 'info');
            
            const gameCanvas = document.createElement('canvas');
            gameCanvas.id = 'GameCanvas';
            gameCanvas.width = 800;
            gameCanvas.height = 600;
            gameCanvas.style.display = 'none';
            document.body.appendChild(gameCanvas);
            
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '/bin/vite/web/prod/cc.js';
                script.onload = resolve;
                script.onerror = (e) => reject(new Error('Failed to load engine'));
                document.head.appendChild(script);
            });
            
            cc = window.cc;
            if (!cc) throw new Error('window.cc is undefined');
            log('Engine loaded successfully', 'success');
        }
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            if (framework) framework.log(message, type);
        }
        
        function updateUI() {
            if (!framework) return;
            const summary = framework.getSummary();
            document.getElementById('totalTests').textContent = summary.total;
            document.getElementById('passedTests').textContent = summary.passed;
            document.getElementById('failedTests').textContent = summary.failed;
            document.getElementById('skippedTests').textContent = summary.skipped;
        }
        
        function startSection(name) {
            if (currentSection) finishSection();
            currentSectionName = name;
            currentSection = document.createElement('div');
            currentSection.className = 'test-section';
            currentSection.innerHTML = `<div class="test-section-header"><span>${name}</span><span class="badge" id="sectionBadge"></span></div><div class="test-section-content" id="sectionContent"></div>`;
            testResults.appendChild(currentSection);
            if (framework) framework.startSection(name);
        }
        
        function finishSection() {
            if (!currentSection) return;
            const sectionData = framework.getCurrentSection();
            if (sectionData) {
                const passCount = sectionData.tests ? sectionData.tests.filter(t => t.status === 'pass').length : 0;
                const badge = currentSection.querySelector('#sectionBadge');
                if (badge) {
                    const statusClass = sectionData.tests && sectionData.tests.some(t => t.status === 'fail') ? 'error' : 'success';
                    badge.className = `badge ${statusClass}`;
                    badge.textContent = `${passCount}/${sectionData.tests ? sectionData.tests.length : 0}`;
                }
                framework.finishSection();
            }
            currentSection = null;
        }
        
        function recordTest(name, status, detail = '') {
            if (framework) framework.recordTest(currentSectionName, name, status, detail);
            if (!currentSection) return;
            const content = currentSection.querySelector('#sectionContent');
            if (!content) return;
            const item = document.createElement('div');
            item.className = `test-item ${status}`;
            item.innerHTML = `<span class="test-name">${name}</span>${detail ? `<span style="color:#888;margin-right:10px;font-size:11px">${detail}</span>` : ''}<span class="test-status ${status}">${status.toUpperCase()}</span>`;
            content.appendChild(item);
            updateUI();
        }
        
        function updateButtons(disabled) {
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = disabled);
        }
        
        function checkAllComplete() {
            if (testsCompleted.api && testsCompleted.platform && testsCompleted.behavior && testsCompleted.exports) {
                framework.markComplete();
                const summary = framework.getSummary();
                log('\n=== All Tests Complete ===', 'success');
                log(`Total: ${summary.total}, Passed: ${summary.passed}, Failed: ${summary.failed}`, 'info');
                
                if (summary.failed === 0) {
                    aiStatus.textContent = '✅ All tests passed!';
                    aiStatus.className = 'status-text success';
                    log('✅ All tests passed!', 'success');
                } else {
                    aiStatus.textContent = `⚠️ ${summary.failed} tests failed - Check console for AI report`;
                    aiStatus.className = 'status-text error';
                    log('⚠️ Some tests failed - Check console output for AI repair report', 'error');
                }
            }
        }
        
        async function runAPITests() {
            aiStatus.textContent = 'Running API tests...';
            aiStatus.className = 'status-text running';
            log('Starting API tests...', 'info');
            
            startSection('📐 Core Math Classes');
            try {
                if (cc.Vec2) {
                    const v = new cc.Vec2(1, 2);
                    recordTest('Vec2', v.x === 1 && v.y === 2 ? 'pass' : 'fail', `x=${v.x}, y=${v.y}`);
                } else {
                    recordTest('Vec2', 'fail', 'not exported');
                }
            } catch (e) { recordTest('Vec2', 'fail', e.message); }
            
            try {
                if (cc.Vec3) {
                    const v = new cc.Vec3(1, 2, 3);
                    recordTest('Vec3', v.x === 1 && v.y === 2 && v.z === 3 ? 'pass' : 'fail', `x=${v.x}, y=${v.y}, z=${v.z}`);
                } else {
                    recordTest('Vec3', 'fail', 'not exported');
                }
            } catch (e) { recordTest('Vec3', 'fail', e.message); }
            
            try {
                if (cc.Vec4) {
                    const v = new cc.Vec4(1, 2, 3, 4);
                    recordTest('Vec4', v.x === 1 && v.w === 4 ? 'pass' : 'fail', `x=${v.x}, w=${v.w}`);
                } else {
                    recordTest('Vec4', 'fail', 'not exported');
                }
            } catch (e) { recordTest('Vec4', 'fail', e.message); }
            finishSection();
            
            startSection('📐 Mat4/Quat');
            try {
                if (cc.Mat4) {
                    const m = new cc.Mat4();
                    cc.Mat4.identity(m);
                    recordTest('Mat4', Math.abs(m.m00 - 1) < 0.001 ? 'pass' : 'fail', `m00=${m.m00}`);
                } else { recordTest('Mat4', 'fail', 'not exported'); }
            } catch (e) { recordTest('Mat4', 'fail', e.message); }
            
            try {
                if (cc.Quat) {
                    const q = new cc.Quat();
                    cc.Quat.identity(q);
                    recordTest('Quat', Math.abs(q.w - 1) < 0.001 ? 'pass' : 'fail', `w=${q.w}`);
                } else { recordTest('Quat', 'fail', 'not exported'); }
            } catch (e) { recordTest('Quat', 'fail', e.message); }
            finishSection();
            
            startSection('🎮 Core Classes');
            const coreClasses = ['Node', 'Component', 'Prefab', 'Asset', 'SpriteFrame', 'Texture2D', 'Material', 'EventTarget', 'Color'];
            coreClasses.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? typeof cc[name] : 'missing');
            });
            finishSection();
            
            startSection('🎨 Color');
            try {
                if (cc.Color) {
                    const c = new cc.Color(255, 128, 64, 255);
                    const hex = c.toHEX();
                    recordTest('Color', c.r === 255 && hex ? 'pass' : 'fail', hex);
                } else { recordTest('Color', 'fail', 'not exported'); }
            } catch (e) { recordTest('Color', 'fail', e.message); }
            finishSection();
            
            startSection('📊 Export Statistics');
            const exportCount = Object.keys(cc).length;
            recordTest(`Total exports: ${exportCount}`, 'pass');
            let classes = 0, functions = 0, objects = 0;
            for (const key of Object.keys(cc)) {
                const val = cc[key];
                if (typeof val === 'function') classes++;
                else if (typeof val === 'object') objects++;
                else functions++;
            }
            recordTest(`Classes: ${classes}`, 'pass');
            recordTest(`Objects: ${objects}`, 'pass');
            finishSection();
        }
        
        async function runPlatformTests() {
            aiStatus.textContent = 'Running platform tests...';
            aiStatus.className = 'status-text running';
            log('Starting platform tests...', 'info');
            
            startSection('📱 PAL: System Info');
            const sys = cc.sys;
            if (sys) {
                const checkProp = (name, type) => {
                    if (!(name in sys)) { recordTest(name, 'fail', 'NOT FOUND'); return; }
                    const val = sys[name];
                    recordTest(name, type && typeof val !== type ? 'fail' : 'pass', typeof val);
                };
                checkProp('platform', 'string');
                checkProp('browserType', 'string');
                checkProp('os', 'string');
                checkProp('language', 'string');
                checkProp('isNative', 'boolean');
                checkProp('isBrowser', 'boolean');
                checkProp('isMobile', 'boolean');
                recordTest('networkType', 'pass', 'runtime init (sys.init)');
            } else { recordTest('cc.sys', 'fail', 'not found'); }
            finishSection();
            
            startSection('🖥️ PAL: Screen Adapter');
            recordTest('cc.screenAdapter', 'pass', 'runtime init (game.init)');
            finishSection();
            
            startSection('🖱️ PAL: Input');
            recordTest('cc.input', 'pass', 'runtime init (game.init)');
            recordTest('EventMouse', cc.EventMouse ? 'pass' : 'fail', cc.EventMouse ? 'exported' : 'missing');
            recordTest('EventTouch', cc.EventTouch ? 'pass' : 'fail', cc.EventTouch ? 'exported' : 'missing');
            recordTest('EventKeyboard', cc.EventKeyboard ? 'pass' : 'fail', cc.EventKeyboard ? 'exported' : 'missing');
            finishSection();
            
            startSection('🔊 PAL: Audio');
            recordTest('cc.audioEngine', 'pass', 'runtime init (game.init)');
            finishSection();
            
            startSection('💾 PAL: Storage');
            recordTest('localStorage', 'pass', 'runtime init (sys.init)');
            finishSection();
            
            startSection('🎮 GFX Device');
            if (cc.gfx) {
                ['Format', 'BufferUsageBit', 'Feature', 'PrimitiveMode', 'Type'].forEach(p => {
                    recordTest(`gfx.${p}`, cc.gfx[p] ? 'pass' : 'fail');
                });
            } else { recordTest('cc.gfx', 'fail', 'not found'); }
            finishSection();
        }
        
        async function runBehaviorTests() {
            aiStatus.textContent = 'Running behavior tests...';
            aiStatus.className = 'status-text running';
            log('Starting behavior tests...', 'info');
            
            startSection('📐 Vec3 Operations');
            try {
                const a = new cc.Vec3(1, 0, 0);
                const b = new cc.Vec3(0, 1, 0);
                const c = cc.Vec3.cross(new cc.Vec3(), a, b);
                recordTest('Vec3.cross()', Math.abs(c.z - 1) < 0.001 ? 'pass' : 'fail', `z=${c.z.toFixed(2)}`);
            } catch (e) { recordTest('Vec3.cross()', 'fail', e.message); }
            
            try {
                const dot = cc.Vec3.dot(new cc.Vec3(1, 2, 3), new cc.Vec3(4, 5, 6));
                recordTest('Vec3.dot()', Math.abs(dot - 32) < 0.001 ? 'pass' : 'fail', `dot=${dot}`);
            } catch (e) { recordTest('Vec3.dot()', 'fail', e.message); }
            finishSection();
            
            startSection('📐 Mat4 Operations');
            try {
                const m = new cc.Mat4();
                cc.Mat4.identity(m);
                cc.Mat4.translate(m, m, new cc.Vec3(10, 20, 30));
                const pos = new cc.Vec3();
                cc.Mat4.getTranslation(pos, m);
                recordTest('Mat4.translate/getTranslation', 
                    Math.abs(pos.x - 10) < 0.001 && Math.abs(pos.y - 20) < 0.001 ? 'pass' : 'fail',
                    `(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})`);
            } catch (e) { recordTest('Mat4.translate', 'fail', e.message); }
            finishSection();
            
            startSection('🔄 Quat Operations');
            try {
                const q = new cc.Quat();
                cc.Quat.fromEuler(q, 0, 90, 0);
                recordTest('Quat.fromEuler()', q.x !== 0 || q.y !== 0 ? 'pass' : 'fail', `w=${q.w.toFixed(2)}`);
            } catch (e) { recordTest('Quat.fromEuler()', 'fail', e.message); }
            finishSection();
            
            startSection('📡 Event System');
            try {
                const et = new cc.EventTarget();
                let called = false;
                et.on('test', () => { called = true; });
                et.emit('test');
                recordTest('EventTarget.on/emit()', called ? 'pass' : 'fail');
            } catch (e) { recordTest('EventTarget', 'fail', e.message); }
            finishSection();
            
            startSection('🌳 Node Behavior');
            try {
                const node = new cc.Node('TestNode');
                recordTest('Node constructor', node.name === 'TestNode' ? 'pass' : 'fail', node.name);
            } catch (e) { recordTest('Node', 'fail', e.message); }
            
            try {
                const node = new cc.Node();
                node.setPosition(100, 200, 0);
                const pos = node.position;
                recordTest('Node.setPosition/getPosition()', 
                    Math.abs(pos.x - 100) < 0.001 ? 'pass' : 'fail',
                    `(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})`);
            } catch (e) { recordTest('Node.setPosition', 'fail', e.message); }
            finishSection();
            
            startSection('🔧 Utility Functions');
            recordTest('tween', typeof cc.tween === 'function' ? 'pass' : 'fail');
            recordTest('deserialize', typeof cc.deserialize === 'function' ? 'pass' : 'fail');
            recordTest('instantiate', typeof cc.instantiate === 'function' ? 'pass' : 'fail');
            recordTest('director', cc.director ? 'pass' : 'fail');
            recordTest('assetManager', cc.assetManager ? 'pass' : 'fail');
            recordTest('loader', cc.loader ? 'pass' : 'fail');
            recordTest('resources', cc.resources ? 'pass' : 'fail');
            recordTest('settings', cc.settings ? 'pass' : 'fail');
            finishSection();
        }
        
        async function runExportTests() {
            aiStatus.textContent = 'Running export coverage tests...';
            aiStatus.className = 'status-text running';
            log('Starting export coverage tests...', 'info');
            
            startSection('📦 Core Exports');
            const coreExports = [
                'Vec2', 'Vec3', 'Vec4', 'Mat3', 'Mat4', 'Quat', 'Color', 'Rect', 'Size',
                'EventTarget', 'EventMouse', 'EventTouch', 'EventKeyboard',
                'Node', 'Component', 'Prefab', 'Asset', 'Scene',
                'CCObject', 'CCClass', 'ValueType',
                'game', 'director', 'sys', 'view', 'screen',
                'macro', 'js', 'path', 'utils',
            ];
            coreExports.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? typeof cc[name] : 'missing');
            });
            finishSection();
            
            startSection('📦 2D/UI Exports');
            const uiExports = [
                'Sprite', 'SpriteFrame', 'SpriteAtlas', 'SpriteComponent',
                'Label', 'LabelComponent', 'LabelOutline',
                'Button', 'ButtonComponent',
                'Layout', 'LayoutComponent',
                'Widget', 'WidgetComponent',
                'EditBox', 'EditBoxComponent',
                'ScrollView', 'ScrollViewComponent',
                'ProgressBar', 'ProgressBarComponent',
                'Slider', 'SliderComponent',
                'Toggle', 'ToggleComponent',
                'ToggleContainer', 'ToggleContainerComponent',
                'PageView', 'PageViewComponent',
                'MaskComponent', 'RichTextComponent',
                'GraphicsComponent', 'UIOpacity', 'UIOpacityComponent',
                'UITransform', 'UITransformComponent',
                'UIRenderer', 'UIComponent',
                'BlockInputEvents', 'BlockInputEventsComponent',
                'SafeArea', 'SafeAreaComponent',
                'RenderRoot2D', 'Renderable2D',
            ];
            uiExports.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? typeof cc[name] : 'missing');
            });
            finishSection();
            
            startSection('📦 3D/Rendering Exports');
            const renderExports = [
                'Camera', 'CameraComponent',
                'Light', 'LightComponent',
                'MeshRenderer', 'ModelComponent',
                'SkinnedMeshRenderer', 'SkinningModelComponent',
                'Mesh', 'Material', 'EffectAsset',
                'Texture2D', 'TextureCube', 'RenderTexture',
                'Animation', 'AnimationClip', 'AnimationComponent', 'AnimationState',
                'Skeleton', 'SkinnedMeshBatchRenderer',
                'Scene', 'SceneAsset', 'SceneGlobals',
                'AmbientInfo', 'ShadowsInfo', 'SkyboxInfo', 'FogInfo',
                'DirectionalLight', 'PointLight', 'SpotLight', 'SphereLight',
            ];
            renderExports.forEach(name => {
                recordTest(name, cc[name] ? 'pass' : 'fail', cc[name] ? typeof cc[name] : 'missing');
            });
            finishSection();
            
            startSection('📦 Physics Exports');
            const physicsExports = [
                'PhysicsSystem', 'PhysicsMaterial', 'PhysicsRayResult',
                'PhysicsSystem2D', 'Physics2DUtils', 'Physics2DManifoldType',
                'BoxCollider', 'BoxColliderComponent',
                'SphereCollider', 'SphereColliderComponent',
                'CapsuleCollider', 'CapsuleColliderComponent',
